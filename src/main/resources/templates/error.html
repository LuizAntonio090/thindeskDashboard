<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thindesk — Não foi possível abrir a página</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="error-page"><main>
    <p>Thindesk · <span th:text="${status}">Erro</span></p>
    <h1 th:text="${status == 404 ? 'Página não encontrada' : 'Não foi possível abrir esta página'}"></h1>
    <p th:text="${status == 404 ? 'Confira o endereço ou utilize o menu do sistema.' : 'Tente novamente. Se o problema continuar, consulte o responsável pelo sistema.'}"></p>
    <a th:href="@{/}">Voltar ao início</a> · <a th:href="@{/dashboard}">Abrir dashboard</a>
</main></body></html>
